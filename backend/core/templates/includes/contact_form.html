{% load static %}
<section class="mb-5" id="обсудим-проект">
    <div class="row d-flex justify-content-center">
        <div class="col-sm-auto col-lg-12 mb-3">
            <div class="card-catch">
                <div class="card-body d-flex flex-column p-0">
                    <div class="row mb-4">
                        <div class="col-md-4"></div>
                        <div class="col-md-7">
                            <div class="card-catch-header">Обсудим ваш проект?</div>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-4"></div>
                        <div class="col-md-7">
                            <div class="card-catch-text">Оставьте заявку и мы свяжемся с вами в ближайшее время</div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4"></div>
                        <div class="col-md-7">
                            <form method="POST" action="/contact/" class="contact-form">
                                {% csrf_token %}
                                <input type="hidden" name="source" value="{{ form_source|default:'Главная' }}">
                                <div class="row g-3">
                                    <div class="col-12 col-md-6">
                                        <input type="text" name="name"
                                               class="form-control contact-form-input"
                                               placeholder="Ваше имя"
                                               minlength="2" maxlength="255"
                                               required>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <input type="tel" name="phone" id="phoneInput"
                                               class="form-control contact-form-input"
                                               placeholder="+7 (___) ___-__-__"
                                               required>
                                        <div class="contact-form-error" id="phoneError" style="display:none;">
                                            Введите корректный номер телефона
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <textarea name="message"
                                                  class="form-control contact-form-input"
                                                  rows="3"
                                                  placeholder="Расскажите о вашем проекте"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check contact-form-check">
                                            <input type="checkbox" class="form-check-input contact-check-input"
                                                   id="consentCheck{{ form_source|slugify }}"
                                                   name="consent" required>
                                            <label class="form-check-label contact-check-label"
                                                   for="consentCheck{{ form_source|slugify }}">
                                                Я соглашаюсь с
                                                <a href="/page/privacy/" target="_blank" class="contact-form-link">политикой конфиденциальности</a>
                                                и даю
                                                <a href="/page/consent/" target="_blank" class="contact-form-link">согласие на обработку персональных данных</a>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn card-catch-button">
                                            Отправить заявку
                                            <img class="ms-3" src="{% static 'images/arrow-1.svg' %}" alt="">
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
