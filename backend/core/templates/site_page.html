{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="mt-5 mb-5">
    <div class="row">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb project-breadcrumb">
                    <li class="breadcrumb-item"><a href="/" class="project-breadcrumb-link">главная</a></li>
                    <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
                </ol>
            </nav>
        </div>
    </div>
    <div class="row mt-4 mb-5">
        <div class="col-12 col-lg-10">
            <h1 class="header-font-size mb-4">{{ page.title }}</h1>
            <div class="site-page-content">
                {{ page.content|safe }}
            </div>
        </div>
    </div>
</section>

{% endblock %}
